name: Build and Push Docker Images

on:
  pull_request:
    branches: ["main"]

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -t bsu-api ./bsu_warehouse_server/bsu_api/
          docker tag bsu-api ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:api-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:api-latest

      - name: Build and push Frontend image
        run: |
          docker build -t bsu-frontend ./bsu_warehouse_server/bsu_frontend/
          docker tag bsu-frontend ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:frontend-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:frontend-latest
