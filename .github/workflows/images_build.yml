name: Build and Push Docker Images

on:
  push:
    branches: ["main"]

permissions:
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -t bsu-api ./bsu_api/
          # docker hub
          docker tag bsu-api ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:api-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:api-latest
          # docker github container
          docker tag bsu-api ghcr.io/${{ github.repository_owner }}/bsu-warehouse:api-latest
          docker push ghcr.io/${{ github.repository_owner }}/bsu-warehouse:api-latest

      - name: Build and push Frontend image
        run: |
          docker build -t bsu-frontend ./bsu_frontend/
          # docker hub
          docker tag bsu-frontend ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:frontend-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bsu-warehouse:frontend-latest
          # docker github container
          docker tag bsu-frontend ghcr.io/${{ github.repository_owner }}/bsu-warehouse:frontend-latest
          docker push ghcr.io/${{ github.repository_owner }}/bsu-warehouse:frontend-latest
