<div class="notification-container">

    <div class="notification-header info">
        <h1>🤖 {{ header_title }}</h1>
    </div>

    <div class="notification-content info">
        <h2>{{ subject }}</h2>
        <h2>Status Update: Robot "{{ robot_namespace }}"</h2>
        <p>Here is the latest system report from your ROS2 robot:</p>

        <div class="notification-status info">
            Status: <span>{{ status }}</span><br>
        </div>

        <div class="notification-message info">
            <p>{{ message }}</p>
        </div>

    </div>

    <div class="notification-departement-message">
